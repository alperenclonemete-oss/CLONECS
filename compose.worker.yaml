services:
  match-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.worker
    environment:
      PYTHONUNBUFFERED: "1"
      NODE_BINARY: /usr/local/bin/node
    restart: unless-stopped
    init: true
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
