services:
  - type: web
    name: cs2-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FACEIT_API_KEY
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FACEIT_GAME_ID
        value: cs2
      - key: COOKIE_SECURE
        value: "true"
