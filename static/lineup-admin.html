<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CLONE LAB · Lineup yönetimi</title><link rel="stylesheet" href="/static/style.css?v=6.1"><link rel="stylesheet" href="/static/lineup-admin.css?v=1"></head><body><main class="editor-shell"><header><a href="/">← CLONE LAB</a><h1>Lineup yönetimi</h1><p>Önce taslak kaydet. Yayımla düğmesine basana kadar değişiklikleri yalnızca sen görürsün.</p></header><p id="editorStatus" role="status">Yetki kontrol ediliyor…</p><section id="editorWorkspace" hidden><div class="editor-toolbar"><label>Harita<select id="editorMap"></select></label><label>Mevcut atış<select id="editorItem"></select></label><button id="editorNew">Yeni atış</button><button id="editorExport" class="secondary">Taslakları indir (JSON)</button></div><div class="editor-grid"><div><div class="editor-toolbar"><label>İşaretle<select id="editorPoint"><option value="start">Başlangıç noktası</option><option value="target">Düşüş noktası</option></select></label><label>Görünen kat<select id="editorFloor"><option value="upper">Üst kat</option><option value="lower">Alt kat</option></select></label></div><p>Haritaya tıkla. Turuncu başlangıç, yeşil hedef. Hassas değerleri sağdan da yazabilirsin.</p><div id="editorRadar"><img id="editorRadarImage" alt="Harita radarı"><svg viewBox="0 0 100 100" id="editorMarks" aria-hidden="true"></svg></div></div><form id="editorForm"><label>Başlık<input id="editorTitle" maxlength="180" required></label><div class="editor-toolbar"><label>Bomba<select id="editorType"><option value="smoke">Smoke</option><option value="flash">Flash</option><option value="molotov">Molotof</option><option value="he">HE</option></select></label><label>Taraf<select id="editorTeam"><option>T</option><option>CT</option></select></label></div><div class="editor-coordinates"><label>Başlangıç X<input id="editorX" type="number" min="0" max="100" step="any" required></label><label>Başlangıç Y<input id="editorY" type="number" min="0" max="100" step="any" required></label><label>Hedef X<input id="editorTX" type="number" min="0" max="100" step="any" required></label><label>Hedef Y<input id="editorTY" type="number" min="0" max="100" step="any" required></label></div><div class="editor-toolbar"><label>Başlangıç katı<select id="editorStartFloor"><option value="upper">Üst</option><option value="lower">Alt</option></select></label><label>Hedef katı<select id="editorTargetFloor"><option value="upper">Üst</option><option value="lower">Alt</option></select></label></div><label>Nerede durulur<textarea id="editorFrom" maxlength="2000"></textarea></label><label>Nereye nişan alınır<textarea id="editorAim" maxlength="2000"></textarea></label><label>Nasıl atılır<textarea id="editorThrow" maxlength="2000"></textarea></label><label>Kendi videonu yükle · MP4 / WebM, en fazla 32 MB<input type="file" id="editorVideo" accept="video/mp4,video/webm"></label><video id="editorVideoPreview" controls playsinline preload="metadata" hidden></video><button id="editorRemoveVideo" type="button" class="secondary">Videoyu taslaktan kaldır</button><label><input type="checkbox" id="editorHidden">Yayımlandığında bu atışı katalogdan gizle</label><div class="editor-toolbar"><button id="editorSave" type="submit">Taslağı kaydet</button><button id="editorPublish" class="secondary" type="button">Kaydedilmiş taslağı yayımla</button></div></form></div></section></main><script src="/static/lineup-catalog.js?v=4" defer></script><script src="/static/lineup-admin.js?v=1" defer></script></body></html>
